<rect x="800" y="60" width="128" height="28" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="864.0" y="79.0" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#222">Theme: Light</text><text x="480" y="220" font-family="Arial, Helvetica, sans-serif" font-size="44" text-anchor="middle" fill="#222" font-weight="bold">THREE CARD POKER</text><text x="480" y="258" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" fill="#555">Two players vs. the Dealer</text><rect x="360" y="310" width="240" height="48" rx="4" fill="#222" stroke="#222" stroke-width="1.5"/><text x="480.0" y="339.0" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">START GAME</text><rect x="360" y="375" width="240" height="48" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="480.0" y="404.0" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#222">How to Play</text><rect x="360" y="440" width="240" height="48" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="480.0" y="469.0" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#222">Exit</text><text x="615" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#c2185b" font-style="italic">← primary action, has keyboard focus</text><text x="615" y="404" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#c2185b" font-style="italic">← opens Rules dialog</text><text x="615" y="469" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#c2185b" font-style="italic">← closes the app</text>
