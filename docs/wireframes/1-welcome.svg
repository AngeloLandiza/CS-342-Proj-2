<rect x="700" y="62" width="108" height="32" rx="16.0" fill="none" stroke="#1d2b3a" stroke-width="1.5"/><text x="754.0" y="83.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1d2b3a" font-weight="bold">◐ Theme</text><rect x="820" y="62" width="100" height="32" rx="16.0" fill="none" stroke="#1d2b3a" stroke-width="1.5"/><text x="870.0" y="83.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1d2b3a" font-weight="bold">Exit  ✕</text><text x="80" y="210" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#a59f93" font-weight="bold">CS 342 · PROJECT 2</text><text x="80" y="272" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="56" text-anchor="start" fill="#1d2b3a" font-weight="bold">Three Card Poker</text><rect x="80" y="294" width="64" height="5" rx="2.5" fill="#e0643a" stroke="none" stroke-width="1.5"/><text x="80" y="336" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#5b6672">Two players. One dealer. Beat the hand.</text><rect x="80" y="380" width="220" height="52" rx="26.0" fill="#e0643a" stroke="none" stroke-width="1.5"/><text x="190.0" y="411.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">Start Game</text><rect x="316" y="380" width="170" height="52" rx="26.0" fill="none" stroke="#1d2b3a" stroke-width="1.5"/><text x="401.0" y="411.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1d2b3a" font-weight="bold">How to Play</text><rect x="610" y="262" width="310" height="200" rx="100" fill="#1f5c45" stroke="#143d2e" stroke-width="6"/><rect x="667" y="322" width="56" height="80" rx="10" fill="#fff" stroke="#d9d0bf" stroke-width="1"/><text x="675" y="342" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#1d2b3a" font-weight="bold">A♠</text><text x="695.0" y="380" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" text-anchor="middle" fill="#1d2b3a">♠</text><rect x="733" y="306" width="56" height="80" rx="10" fill="#fff" stroke="#d9d0bf" stroke-width="1"/><text x="741" y="326" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#e0643a" font-weight="bold">K♥</text><text x="761.0" y="364" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" text-anchor="middle" fill="#e0643a">♥</text><rect x="799" y="322" width="56" height="80" rx="10" fill="#fff" stroke="#d9d0bf" stroke-width="1"/><text x="807" y="342" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#e0643a" font-weight="bold">Q♦</text><text x="827.0" y="380" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" text-anchor="middle" fill="#e0643a">♦</text>
<text x="20" y="632" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#2f7d6d" font-style="italic">Hierarchy: one filled primary action (Start Game); How to Play is secondary and opens the Rules dialog.</text>
<text x="20" y="654" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#2f7d6d" font-style="italic">Exit sits top right, away from Start Game, so it is not clicked by accident. Theme switches Light / Dark.</text>
<text x="20" y="676" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#2f7d6d" font-style="italic">Start Game has keyboard focus on load. Transition: screens fade out / in (FadeTransition).</text>
</svg>