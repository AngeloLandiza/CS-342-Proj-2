 x="505" y="252" width="56" height="80" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="533.0" y="300" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" fill="#b00020" font-weight="bold">9♥</text><rect x="571" y="252" width="56" height="80" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="599.0" y="300" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" fill="#222" font-weight="bold">5♣</text><rect x="637" y="252" width="56" height="80" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="665.0" y="300" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" fill="#222" font-weight="bold">2♠</text><rect x="710" y="278" width="150" height="28" rx="4" fill="#e6e6e6" stroke="#999" stroke-width="1.5"/><text x="785" y="297" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">HIGH CARD</text><text x="505" y="359" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#222" font-weight="bold">RESULT:  LOSE vs. Dealer</text><text x="505" y="381" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#222">Ante        $5   →  −$5</text><text x="505" y="403" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#222">Play        $5   →  −$5</text><text x="505" y="425" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#222">Pair Plus  —</text><text x="505" y="447" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#222" font-weight="bold">This round:  −$10</text><rect x="505" y="478" width="400" height="36" rx="4" fill="#f4f4f4" stroke="#222" stroke-width="1.5"/><text x="515" y="502" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="start" fill="#222" font-weight="bold">TOTAL WINNINGS:  −$10</text><rect x="290" y="545" width="180" height="40" rx="4" fill="#222" stroke="#222" stroke-width="1.5"/><text x="380.0" y="570.0" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">PLAY AGAIN</text><rect x="490" y="545" width="180" height="40" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="580.0" y="570.0" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#222">MAIN MENU</text>
<text x="20" y="632" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#c2185b" font-style="italic">Animation: each TOTAL WINNINGS box briefly scales up (ScaleTransition) — draws the eye to the new total.</text>
<text x="20" y="654" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#c2185b" font-style="italic">If the dealer does NOT qualify, the tag reads "DOES NOT QUALIFY (needs Queen-high)" and the</text>
<text x="20" y="676" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#c2185b" font-style="italic">message says: "Play wager returned; Ante carries to next round."</text>
<text x="20" y="698" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#c2185b" font-style="italic">WIN / LOSE / FOLDED / PUSH are written in text, never shown by color alone.</text>
</svg>